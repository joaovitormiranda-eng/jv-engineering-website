name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: ./hugo-up-business

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Test supply-chain safeguards
        working-directory: .
        run: python3 .github/scripts/test-supply-chain.py

      - name: Install Hugo CLI
        working-directory: .
        run: bash .github/scripts/install-hugo.sh

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Install Node dependencies
        run: npm ci --include=dev --ignore-scripts

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL="https://joaovitormiranda-eng.github.io/jv-engineering-website/"

      - name: Verify build output
        working-directory: .
        run: python3 .github/scripts/verify-build.py hugo-up-business/public --manifest "$RUNNER_TEMP/site-manifest.json"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./hugo-up-business/public
          retention-days: 1
          include-hidden-files: false

      - name: Verify Pages archive
        working-directory: .
        run: python3 .github/scripts/verify-build.py --archive "$RUNNER_TEMP/artifact.tar" --manifest "$RUNNER_TEMP/site-manifest.json"

  deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
