name: CI

on:
  pull_request:
    branches: ["main"]

permissions: {}

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: ./hugo-up-business

jobs:
  build:
    name: Build Hugo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HUGO_ENVIRONMENT: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Test supply-chain safeguards
        working-directory: .
        run: python3 .github/scripts/test-supply-chain.py

      - name: Install Hugo CLI
        working-directory: .
        run: bash .github/scripts/install-hugo.sh

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Install Node dependencies
        run: npm ci --include=dev --ignore-scripts

      - name: Build with Hugo
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL="https://joaovitormiranda-eng.github.io/jv-engineering-website/"

      - name: Verify build output
        working-directory: .
        run: python3 .github/scripts/verify-build.py hugo-up-business/public --manifest "$RUNNER_TEMP/site-manifest.json"
