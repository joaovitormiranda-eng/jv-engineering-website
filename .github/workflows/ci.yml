name: CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: ./hugo-up-business

jobs:
  build:
    name: Build Hugo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUGO_VERSION: 0.164.0
      HUGO_ENVIRONMENT: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Install Node dependencies
        run: npm ci --include=dev --ignore-scripts

      - name: Build with Hugo
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL="https://joaovitormiranda-eng.github.io/jv-engineering-website/"

      - name: Verify build output
        run: |
          for file in public/index.html public/portfolio/index.html public/sitemap.xml; do
            if [ ! -s "$file" ]; then
              echo "::error::Build output missing or empty: $file"
              exit 1
            fi
          done
          if [ -z "$(find public/css -type f -name 'styles.*.css' -size +0c -print -quit)" ]; then
            echo "::error::Compiled Tailwind CSS missing or empty"
            exit 1
          fi
          if [ -z "$(find public/js -type f -name '*.js' -size +0c -print -quit)" ]; then
            echo "::error::Compiled JavaScript missing or empty"
            exit 1
          fi
