title: "Um caminho para definir o atendimento"
text: "Este é o fluxo proposto para organizar a conversa e combinar cada trabalho. A viabilidade, os prazos e os materiais dependem da avaliação da demanda."
modes:
  - title: "Orientação e explicação"
    text: "Compreender conceitos e discutir métodos, com participação de quem está aprendendo."
  - title: "Revisão e depuração"
    text: "Investigar erros e revisar código, modelos ou documentação já existentes."
  - title: "Desenvolvimento técnico"
    text: "Implementar uma solução para projeto próprio ou autorizado, conforme requisitos combinados."
steps:
  - title: "Apresentar a necessidade"
    text: "Conte o objetivo e o ponto que precisa esclarecer. Não é necessário enviar arquivos para iniciar."
  - title: "Avaliar a viabilidade"
    text: "Esclarecer requisitos, recursos e responsabilidades; indicar lacunas ou limites para assumir o pedido."
  - title: "Definir o escopo"
    text: "Combinar a modalidade de apoio, os entregáveis, os critérios de conferência e as condições aplicáveis."
  - title: "Executar o combinado"
    text: "Desenvolver, revisar ou explicar as tarefas previstas, com verificações adequadas ao contexto."
  - title: "Documentar e entregar"
    text: "Apresentar os materiais acordados, as instruções pertinentes e as limitações conhecidas."
limits:
  - title: "Aprendizado e autoria"
    text: "Apoio à compreensão e ao desenvolvimento legítimo. Não inclui fazer provas ou assumir a autoria de atividades avaliativas em nome de terceiros."
  - title: "Atendimento remoto"
    text: "Projetos com hardware dependem dos materiais e das condições de teste disponíveis. Não há promessa de montagem ou validação física sem avaliação."
  - title: "Responsabilidade técnica"
    text: "Não são oferecidos medição presencial, inspeção de instalações, laudos, ART ou responsabilidade técnica regulamentada."
  - title: "Viabilidade e condições"
    text: "Mencionar uma área não garante a aceitação de qualquer pedido. Prazos e entregáveis são combinados após avaliação, sem promessa de resultado universal."
