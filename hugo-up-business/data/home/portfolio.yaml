enable: true
title: "Projetos e estudos em destaque"
text: "Quatro estudos com método, figuras, código e limites documentados, incluindo a engenharia desta própria plataforma. Cada um mostra uma abordagem em um contexto específico."

# Studies shown in the home explorer, in this order. Title, description,
# categories, tags, figure and caption come from each study's front matter,
# so the home never restates (or drifts from) the published study.
# `short` is only the compact label of the selector chip on narrow screens;
# the full study title stays in the accessible name of each tab.
studies:
  - path: "/portfolio/modelagem-simulacao"
    short: "PDS"
  - path: "/portfolio/qualidade-energia"
    short: "QEE"
  - path: "/portfolio/solucoes-computacionais"
    short: "Fuzzy"
  - path: "/portfolio/plataforma-web"
    short: "Web"
