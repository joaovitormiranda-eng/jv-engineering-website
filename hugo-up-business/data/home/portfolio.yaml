# Studies shown in the hero explorer (S31), in this order. Title, description,
# categories, figure, caption and data nature come from each study's front
# matter, so the home never restates (or drifts from) the published study.
# `short` is the label of the selector tab; the full study title stays in its
# accessible name.
studies:
  - path: "/portfolio/modelagem-simulacao"
    short: "PDS"
  - path: "/portfolio/qualidade-energia"
    short: "QEE"
  - path: "/portfolio/solucoes-computacionais"
    short: "Fuzzy"
  - path: "/portfolio/plataforma-web"
    short: "Web"
