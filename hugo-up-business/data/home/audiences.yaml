enable: true

# 02 · Dois caminhos. A Home abre a bifurcação de públicos logo após o perfil,
# para que cada visitante encontre seu caminho sem transformar o site em duas
# plataformas. Os destinos são páginas que já existem; nada aqui promete
# resultado, preço ou prazo.
title: "Você chegou por qual caminho?"
text: "A JV Engineering atende dois públicos com objetivos diferentes. Escolha o ponto de partida; os caminhos se cruzam quando faz sentido."

paths:
  - id: "estudante"
    kicker: "Preciso de apoio técnico"
    title: "Estudante ou demanda técnica"
    text: "Uma dúvida, um código que não roda, um projeto de engenharia ou computação. Apresente o contexto para avaliar orientação, revisão ou desenvolvimento, com escopo e limites claros."
    href_ref: "/servicos"
    cta: "Ver áreas de atendimento"
    points:
      - "Orientação, revisão ou desenvolvimento técnico"
      - "Escopo avaliado por demanda, sem promessa de resultado"
      - "Contato direto por WhatsApp"
  - id: "recrutador"
    kicker: "Quero avaliar competências"
    title: "Recrutador ou profissional"
    text: "Projetos reais com método, código e resultados verificáveis. Veja as decisões de engenharia por trás de cada estudo e o código-fonte público."
    href_ref: "/portfolio"
    cta: "Explorar o portfólio técnico"
    points:
      - "Quatro estudos com figuras e parâmetros documentados"
      - "Código em repositórios públicos no GitHub"
      - "O próprio site é um projeto de engenharia de software"
