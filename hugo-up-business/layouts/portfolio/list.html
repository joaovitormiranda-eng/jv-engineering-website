{{ define "main" }}
<section class="py-16 bg-[#0a0f1d] text-white min-h-screen">
  <div class="container mx-auto px-4">
    {{ with .Title }}
    <h1 class="text-white mb-6 text-center text-4xl font-extrabold xl:text-6xl">{{ . | markdownify }}</h1>
    {{ end }}

    {{ with .Params.description }}
    <p class="mx-auto mb-16 text-center text-gray-300 text-base xl:text-lg leading-relaxed xl:max-w-[60%]">
      {{ . | markdownify }}
    </p>
    {{ end }}

    {{ partial "portfolio/cards.html" (.Paginate .RegularPages).Pages }}

    <div class="pt-16 pb-8">
      {{ partial "pagination.html" . }}
    </div>
  </div>
</section>
{{ end }}
